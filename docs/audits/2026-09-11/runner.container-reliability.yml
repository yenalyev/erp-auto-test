# Reviewed proposal only; not applied to running containers.
# Layer over runner/docker-compose.yml AND its currently used docker-compose.dev.yml.
services:
  test-runner:
    init: true
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Liveness only; the current endpoint always returns UP.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
