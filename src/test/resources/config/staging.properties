ssh.port=22
ssh.username=cukerochka
ssh.key.path=
ssh.password=j47fgSpgxzu3bGs
ssh.remote.db.host=localhost
ssh.remote.db.port=5432
ssh.local.port=5434

# JDBC URL — direct to staging DB on VPN (no tunnel); set private VPC IP if different from ssh.host
