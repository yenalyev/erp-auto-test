# ===========================================
# Stage Environment
# Run: mvn test -Denv=stage -Dsuite=functional
# Session auth: Playwright (headless Chromium)
# Token auth:   Keycloak REST endpoint
# ===========================================

# dev url (frontend SPA)
base.url=https://stage.cukerochka.sbs
# backend API + OAuth login (matches tk-ui VITE_BACKEND_URL / {origin}/server)
backend.url=https://stage.cukerochka.sbs/server

# Default user for tests
auth.default.user=owner1

# Test user credentials
auth.username=bar
auth.password=karta33#

# Keycloak URL for token-based auth (password grant).
auth.keycloak.url=http://localhost:8090
auth.keycloak.realm=tk
auth.keycloak.client.id=tk-admin
auth.keycloak.client.secret=aI8sUo3W6kRvEzCy9cLY9unvSjwgdgks

# -----------------------------------------------
# Database (SSH tunnel to remote dev server)
# Set use.database=true and ssh.enabled=true to enable DB assertions.
# -----------------------------------------------
use.database=true

# SSH tunnel settings (fill in to enable)
ssh.enabled=true
ssh.host=3.252.233.141
ssh.port=22
ssh.username=ubuntu
ssh.key.path=C:/Users/gigam/.ssh/aws-key.pem
ssh.remote.db.host=localhost
ssh.remote.db.port=5433
ssh.local.port=5434

# JDBC URL — points to the local tunnel port when SSH is enabled
db.url=jdbc:postgresql://localhost:5434/tkdb
db.username=user
db.password=password

# -----------------------------------------------
# User credentials per role
# -----------------------------------------------
user.admin.username=vector
user.admin.password=karta33#
user.owner1.username=alkatras
user.owner1.password=karta33#
user.owner2.username=bar
user.owner2.password=karta33#
user.owner3.username=owner3
user.owner3.password=karta33#

# Storage IDs per owner (real IDs from dev DB)
owner1.storage.id=1
owner2.storage.id=13
incorrect.storage.id=-1

# Google Sheets reporting
google.sheets.spreadsheet.id=10q5vjXWjsaq6E8DeeRbpPU2HbMfcoDDSeeyg5UkDhTk
google.sheets.enabled=false

# Logging (false = less console I/O during API tests; set true when debugging HTTP)
logging.verbose=false

# API Timeout
api.timeout=60

# TCM (local instance — set tcm.test.plan.id to your "Autotest" plan id)
tcm.enabled=false
tcm.base.url=http://localhost:8080
tcm.api.token=dev-autotest-token
tcm.test.plan.id=0
