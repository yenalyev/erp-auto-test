# ===========================================
# Stage Environment
# Run: mvn test -Denv=stage -Dsuite=functional
# Bot SLA: mvn test -Denv=staging -Dsuite=bots
# Session auth: Playwright (headless Chromium)
# Token auth:   Keycloak REST endpoint
# ===========================================

# dev url (frontend SPA)
base.url=https://stage.cukerochka.sbs
# backend API + OAuth login (matches tk-ui VITE_BACKEND_URL / {origin}/server)
backend.url=https://stage.cukerochka.sbs/server

# Default user for tests
