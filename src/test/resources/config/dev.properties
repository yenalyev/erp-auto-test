# Bot integrations (whatsapp-bot → internal/storages, delivery-bot → internal/relocations + structure)
# GET_TOKEN_URL, GET_DATA_URL, GET_RELOCATIONS_DATA_URL, GET_STRUCTURE_DATA_URL, CLIENT_ID, CLIENT_SECRET: .env.dev
# Staging: mvn test -Denv=staging -Dsuite=bots  (secrets in .env.staging)
bot.oauth.client.id=inventory-bot
bot.api.timeout.connect.seconds=5
bot.api.timeout.read.seconds=60
bot.api.max.response.bytes=20971520
bot.api.max.response.seconds=30

# TCM integration — push PASS/FAIL after suite (scope: -Dtcm.feature.id / -Dtcm.ac.id from TCM UI)
# Default: TCM from IDEA on :8080. Docker Compose maps host :8100 → container :8080;
# when triggered from TCM UI, runner passes -Dtcm.base.url from tcm.autotest.runner.tcm-base-url.
tcm.enabled=true
tcm.base.url=http://localhost:8080
tcm.api.token=dev-autotest-token
# Legacy fallback when suite runs without feature/ac scope (optional)
tcm.test.plan.id=0
