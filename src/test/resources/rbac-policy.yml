# RBAC Access Control Policy Configuration
rules:
  # ========================================
  # RESOURCE ENDPOINTS
  # ========================================

  # GET all resources
  - endpointName: "RESOURCE_GET_ALL"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Отримати список всіх ресурсів: ADMIN, OWNER_1 - можуть, ANONYMOUS - ні"

  # POST create resource
  - endpointName: "RESOURCE_CREATE"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: "CREATE"

  # PUT update resource name
  - endpointName: "RESOURCE_UPDATE_NAME"
    contextKey: "SHARED_RESOURCE_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: "UPDATE_NAME"

  # PUT update resource unit
  - endpointName: "RESOURCE_UPDATE_UNIT"
    contextKey: "SHARED_RESOURCE_ID"
    allowedRoles: [ ]
    deniedRoles: [ ADMIN, OWNER_1, ANONYMOUS ]
    bodyType: "UPDATE_UNIT"

  # ========================================
  # MEASUREMENT UNIT ENDPOINTS
  # ========================================
  - endpointName: "MEASUREMENT_UNIT_GET_ALL"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Отримати список всіх MEASUREMENT UNIT: ADMIN та OWNER_1 мають право, ANONYMOUS - ні"


  # POST create measurement unit
  - endpointName: "MEASUREMENT_UNIT_POST_CREATE"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: "CREATE_MEASUREMENT_UNIT"
    description: "Створити новий MEASUREMENT UNIT: тільки ADMIN має право, OWNER_1 та ANONYMOUS - ні"


  # ========================================
  # TECHNOLOGICAL MAP ENDPOINTS
  # ========================================

  - endpointName: "TECH_MAP_GET_ALL"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null

  - endpointName: "TECH_MAP_CREATE"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: "CREATE_TECH_MAP"
    description: "Створити нову TECH_MAP: тільки ADMIN має право, OWNER_1 та ANONYMOUS - ні"

  - endpointName: "TECH_MAP_UPDATE_NAME"
    contextKey: "DYNAMIC_TECH_MAP_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: "UPDATE_TECH_MAP_NAME"
    description: "Змінити назву (name) TECH_MAP: тільки ADMIN має право, OWNER_1 та ANONYMOUS - ні"

  # ========================================
  # STORAGE ENDPOINTS
  # ========================================

  - endpointName: "STORAGE_GET_ALL"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Отримати всі Бізнес Юніти (STORAGES): ADMIN та OWNER_1 мають право, ANONYMOUS - ні"

  - endpointName: "STORAGE_POST_CREATE"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: "CREATE_STORAGE"
    description: "Створити новий Бізнес Юніт (STORAGE): тільки ADMIN має право, OWNER_1 та ANONYMOUS - ні"

  - endpointName: "STORAGE_PUT_UPDATE"
    contextKey: "DYNAMIC_STORAGE"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, OWNER_2, ANONYMOUS ]
    bodyType: "UPDATE_STORAGE"
    description: "Змінити NAME існучого Бізнес Юніта (STORAGE): тільки ADMIN має право. OWNER_1 (власник STORAGE_1), OWNER_2 та ANONYMOUS - ні"

  - endpointName: "STORAGE_GET_BY_ID"
    contextKey: "DYNAMIC_STORAGE"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Отримати локацію за id: ADMIN та OWNER_1 мають право, ANONYMOUS - ні"

  - endpointName: "STORAGE_DELETE_DEACTIVATE"
    contextKey: "DYNAMIC_STORAGE"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Архівувати (soft delete) локацію: тільки ADMIN має право, OWNER_1 та ANONYMOUS - ні"

  - endpointName: "STORAGE_PUT_UNARCHIVE"
    contextKey: "DYNAMIC_STORAGE"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Розархівувати локацію: тільки ADMIN має право (глобальний business-unit::delete), OWNER_1 та ANONYMOUS - ні"

  - endpointName: "STORAGE_REGION_GET_ALL"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Список областей видимості: ADMIN та OWNER_1 (business-unit-list::read)"

  - endpointName: "STORAGE_REGION_GET_BY_ID"
    contextKey: "STORAGE_REGION_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Деталі області видимості: ADMIN та OWNER_1"

  - endpointName: "STORAGE_REGION_POST_CREATE"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: "CREATE_REGION"
    description: "Створити область видимості: тільки ADMIN (business-unit::create)"

  - endpointName: "STORAGE_REGION_PUT_UPDATE"
    contextKey: "STORAGE_REGION_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: "UPDATE_REGION"
    description: "Оновити область видимості: тільки ADMIN"

  - endpointName: "STORAGE_REGION_PUT_ADD_LOCATIONS"
    contextKey: "STORAGE_REGION_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Додати локації до області видимості: тільки ADMIN"

  - endpointName: "STORAGE_REGION_GET_RESOURCES"
    contextKey: "STORAGE_REGION_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Список ресурсів області видимості: ADMIN та OWNER_1"

  - endpointName: "STORAGE_REGION_PUT_ADD_RESOURCES"
    contextKey: "STORAGE_REGION_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Додати ресурси до області видимості: тільки ADMIN"

  - endpointName: "STORAGE_REGION_DELETE_RESOURCES"
    contextKey: "STORAGE_REGION_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Прибрати ресурси з області видимості: тільки ADMIN"

  - endpointName: "STORAGE_REGION_DELETE"
    contextKey: "STORAGE_REGION_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Видалити область видимості: тільки ADMIN"

  - endpointName: "STORAGE_GET_LOCATION_LINKS"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Перегляд links видимості для підрозділу: ADMIN та OWNER_1"

  - endpointName: "STORAGE_PUT_ADD_LOCATION_LINKS"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Ручний grant видимості локацій: тільки ADMIN"

  - endpointName: "STORAGE_GET_LOCATION_SUGGEST"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Підказки для прив'язки областей видимості: ADMIN та OWNER_1"

  # ========================================
  # STATISTIC ENDPOINTS
  # ========================================

  - endpointName: "STATISTIC_GET_PLAN"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Отримати статистику плану по Бізнес Юніту який належить OWNER_1 (STORAGES): 
    ADMIN та OWNER_1 мають право, ANONYMOUS - ні"

  - endpointName: "STATISTIC_GET_PLAN"
    contextKey: "OWNER_2_STORAGE_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Отримати статистику плану по Бізнес Юніту який належить OWNER_2 (STORAGES): 
    ADMIN має право, OWNER_1 та ANONYMOUS - ні"

  - endpointName: "STATISTIC_GET_PLAN"
    contextKey: "OWNER_INCORRECT_STORAGE_ID"
    allowedRoles: [ ]
    deniedRoles: [ ADMIN, OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Отримати статистику плану по Бізнес Юніту з невалідним ід (немає такого бізнес юніту)
     (STORAGES): ніхто не отримує доступ ні ADMIN ні OWNER_1 ні ANONYMOUS"

  # ========================================
  # PLAN ENDPOINTS
  # ========================================

  - endpointName: "PLAN_GET_ALL"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ OWNER_2, ANONYMOUS ]
    bodyType: null
    description: "Подивитися всі плани по виробництву Бізнес Юніту який належить OWNER_1: 
    ADMIN та OWNER_1 мають право, OWNER_2 та ANONYMOUS - ні"

  - endpointName: "PLAN_GET_ALL_ADMIN"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, OWNER_2, ANONYMOUS ]
    bodyType: null
    description: "Подивитися всі плани по всіх локаціях (режим «Всі локації» на /plans): тільки ADMIN"

  - endpointName: "PLAN_POST_CREATE"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: "CREATE_PLAN"
    description: "Створити новий план виробництва по Бізнес Юніту який належить OWNER_1: 
    ADMIN має право, OWNER_1 та ANONYMOUS - ні"

  - endpointName: "PLAN_PUT_UPDATE"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: "UPDATE_PLAN"
    description: "Змінити дату плану виробництва по Бізнес Юніту який належить OWNER_1 (STORAGES): 
    ADMIN має право, OWNER_1 та ANONYMOUS - ні"

  - endpointName: "PLAN_GET_BY_ID"
    contextKey: "DYNAMIC_PLAN_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ OWNER_2, ANONYMOUS ]
    bodyType: null
    description: "Отримати план виробництва за id для OWNER_1 storage: ADMIN та OWNER_1 — так, OWNER_2 та ANONYMOUS — ні"

  - endpointName: "PLAN_DELETE"
    contextKey: "DYNAMIC_PLAN_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Видалити план виробництва: лише ADMIN"

  # ========================================
  # GLOBAL PLAN ENDPOINTS
  # ========================================

  - endpointName: "GLOBAL_PLAN_GET_ALL"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, OWNER_2, ANONYMOUS ]
    bodyType: null
    description: "Список глобальних планів: ADMIN — так, OWNER_* та ANONYMOUS — ні"

  - endpointName: "GLOBAL_PLAN_GET_BY_ID"
    contextKey: "GLOBAL_PLAN_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, OWNER_2, ANONYMOUS ]
    bodyType: null
    description: "Отримати глобальний план за id: ADMIN — так"

  - endpointName: "GLOBAL_PLAN_POST_CREATE"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, OWNER_2, ANONYMOUS ]
    bodyType: "CREATE_GLOBAL_PLAN"
    description: "Створити глобальний план: ADMIN — так"

  - endpointName: "GLOBAL_PLAN_PUT_UPDATE"
    contextKey: "GLOBAL_PLAN_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, OWNER_2, ANONYMOUS ]
    bodyType: "UPDATE_GLOBAL_PLAN"
    description: "Оновити глобальний план: ADMIN — так"

  - endpointName: "GLOBAL_PLAN_DELETE"
    contextKey: "GLOBAL_PLAN_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, OWNER_2, ANONYMOUS ]
    bodyType: null
    description: "Видалити глобальний план: ADMIN — так"

  - endpointName: "GLOBAL_PLAN_DECOMPOSE"
    contextKey: "GLOBAL_PLAN_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, OWNER_2, ANONYMOUS ]
    bodyType: null
    description: "Декомпозиція глобального плану: ADMIN — так"

  - endpointName: "GLOBAL_PLAN_GENERATE"
    contextKey: "GLOBAL_PLAN_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, OWNER_2, ANONYMOUS ]
    bodyType: null
    description: "Генерація планів по локаціях: ADMIN — так"

  - endpointName: "GLOBAL_PLAN_REQUIREMENTS_EXPORT"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, OWNER_2, ANONYMOUS ]
    bodyType: null
    description: "Експорт потреб ресурсів: ADMIN — так"


  # ========================================
  # PRODUCTION ENDPOINTS
  # ========================================

  - endpointName: "PRODUCTION_GET_ALL_BY_STORE_ID"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Отримати весь журнал виробництва Бізнес Юніту який належить OWNER_1 (STORAGES): 
    ADMIN та OWNER_1 мають право, ANONYMOUS - ні"

  - endpointName: "PRODUCTION_GET_ALL_BY_STORE_ID"
    contextKey: "OWNER_2_STORAGE_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Отримати статистику плану по Бізнес Юніту який належить OWNER_2 (STORAGES): 
    ADMIN має право, OWNER_1 та ANONYMOUS - ні"

  - endpointName: "PRODUCTION_GET_ALL_BY_STORE_ID"
    contextKey: "OWNER_INCORRECT_STORAGE_ID"
    allowedRoles: [  ]
    deniedRoles: [ ADMIN, OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Отримати статистику плану по Бізнес Юніту з невалідним ід (немає такого бізнес юніту)
     (STORAGES): ніхто не отримує доступ ні ADMIN ні OWNER_1 ні ANONYMOUS"

  - endpointName: "PRODUCTION_POST_CREATE"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ OWNER_1 ]
    deniedRoles: [ ADMIN, OWNER_2, ANONYMOUS ]
    bodyType: "CREATE_SIMPLE_PRODUCTION"
    description: "Додати запис в журнал виробництва по Бізнес Юніту який належить OWNER_1 (STORAGES): 
    має право тільки OWNER_1. ADMIN, OWNER_2, ANONYMOUS - не мають права"

  - endpointName: "ASSEMBLY_READINESS_GET_BY_STORAGE"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Готово до комплектації для storage OWNER_1: ADMIN та OWNER_1 — так, ANONYMOUS — ні"

  - endpointName: "ASSEMBLY_READINESS_GET_BY_STORAGE"
    contextKey: "OWNER_2_STORAGE_ID"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Готово до комплектації для storage OWNER_2: ADMIN — так, OWNER_1 — ні"

  - endpointName: "ASSEMBLY_READINESS_GET_BY_STORAGE"
    contextKey: "OWNER_INCORRECT_STORAGE_ID"
    allowedRoles: [  ]
    deniedRoles: [ ADMIN, OWNER_1, ANONYMOUS ]
    bodyType: null
    description: "Готово до комплектації для невалідного storageId — доступ заборонено"

  - endpointName: "NON_SERIES_PRODUCTION_GET_ALL"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Отримати журнал несерійного виробництва OWNER_1"

  - endpointName: "NON_SERIES_PRODUCTION_GET_TOTAL"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Отримати загальний об'єм несерійного виробництва з урахуванням фільтрів"

  - endpointName: "NON_SERIES_PRODUCTION_GET_BY_ID"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Отримати запис несерійного виробництва за id з storageId query param"

  - endpointName: "NON_SERIES_PRODUCTION_POST_CREATE"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ OWNER_1 ]
    deniedRoles: [ ADMIN, OWNER_2, ANONYMOUS ]
    bodyType: "CREATE_NON_SERIES_PRODUCTION"
    description: "Створити запис несерійного виробництва OWNER_1 — тільки OWNER_1"

  - endpointName: "NON_SERIES_PRODUCTION_PUT_UPDATE"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ OWNER_1 ]
    deniedRoles: [ ADMIN, OWNER_2, ANONYMOUS ]
    bodyType: "UPDATE_NON_SERIES_PRODUCTION"
    description: "Оновити запис несерійного виробництва OWNER_1 — тільки OWNER_1"

  # ========================================
  # PROJECT PRODUCTION ENDPOINTS
  # Тільки non-destructive операції (GET/POST create/PUT update) — FINISH/CANCEL/DELETE/
  # stage mutations покриваються дедикованими функціональними тестами (ProjectProductionTest),
  # бо мутують спільний PROJECT_PRODUCTION_ID і зробили б RBAC-матрицю нестабільною при паралелі/порядку.
  # ========================================

  - endpointName: "PROJECT_PRODUCTION_GET_PAGE"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Журнал проєктного виробництва OWNER_1: ADMIN та OWNER_1 — так, ANONYMOUS — ні"

  - endpointName: "PROJECT_PRODUCTION_GET_BY_ID"
    contextKey: "PROJECT_PRODUCTION_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Проєктне виробництво за id (storageId OWNER_1): ADMIN та OWNER_1 — так, ANONYMOUS — ні"

  - endpointName: "PROJECT_PRODUCTION_POST_CREATE"
    allowedRoles: [ OWNER_1 ]
    deniedRoles: [ ADMIN, OWNER_2, ANONYMOUS ]
    bodyType: "CREATE_PROJECT_PRODUCTION"
    description: "Створити проєктне виробництво OWNER_1 (multipart) — тільки OWNER_1"

  - endpointName: "PROJECT_PRODUCTION_PUT_UPDATE"
    contextKey: "PROJECT_PRODUCTION_ID"
    allowedRoles: [ OWNER_1 ]
    deniedRoles: [ ADMIN, OWNER_2, ANONYMOUS ]
    bodyType: "UPDATE_PROJECT_PRODUCTION"
    description: "Оновити проєктне виробництво OWNER_1 — тільки OWNER_1"

  - endpointName: "PROJECT_PRODUCTION_TEMPLATE_GET_PAGE"
    contextKey: "OWNER_1_STORAGE_ID"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Список шаблонів проєктного виробництва OWNER_1: ADMIN та OWNER_1 — так, ANONYMOUS — ні"

  - endpointName: "PROJECT_PRODUCTION_TEMPLATE_POST_CREATE"
    allowedRoles: [ OWNER_1 ]
    deniedRoles: [ ADMIN, OWNER_2, ANONYMOUS ]
    bodyType: "CREATE_PROJECT_PRODUCTION_TEMPLATE"
    description: "Створити шаблон проєктного виробництва OWNER_1 — тільки OWNER_1"

  - endpointName: "PROJECT_CATEGORY_GET_PAGE"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Список проєктних категорій (глобальний довідник): ADMIN та OWNER_1 — так, ANONYMOUS — ні"

  - endpointName: "PROJECT_CATEGORY_GET_ALL_ACTIVE"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Активні проєктні категорії: ADMIN та OWNER_1 — так, ANONYMOUS — ні"

  - endpointName: "PROJECT_CATEGORY_POST_CREATE"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: "CREATE_PROJECT_CATEGORY"
    description: "Створити проєктну категорію (project-product-type::create — глобальний permission): ADMIN — так, ANONYMOUS — ні. OWNER_1 не перевіряється тут — доступ до цього глобального permission залежить від Keycloak realm (fixture має fallback ADMIN)"

  - endpointName: "PROJECT_PRODUCT_GET_PAGE"
    allowedRoles: [ ADMIN, OWNER_1 ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: null
    description: "Список проєктних продуктів (глобальний довідник): ADMIN та OWNER_1 — так, ANONYMOUS — ні"

  - endpointName: "PROJECT_PRODUCT_POST_CREATE"
    allowedRoles: [ ADMIN ]
    deniedRoles: [ ANONYMOUS ]
    bodyType: "CREATE_PROJECT_PRODUCT"
